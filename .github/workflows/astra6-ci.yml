name: Astra 6 Paper CI
on:
  push:
    branches: [astra6-realistic-paper-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify JavaScript syntax
        run: |
          for f in src/astra6-*.js src/raydium-helius-quotes.js src/jupiter-quote-only.js src/server.js; do node --check "$f"; done
      - name: Run paper trading tests
        run: node --test
